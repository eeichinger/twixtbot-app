<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#16213e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TwixT" />
  <link rel="apple-touch-icon" href="/icons/192.png" />
  <title>TwixT vs AI</title>

  <!-- ===== DIAGNOSTIC OVERLAY (remove once issue is resolved) ===== -->
  <style>
    #diag {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      background: rgba(0,0,0,0.88); color: #39ff14;
      font: 10px/1.4 monospace; padding: 6px 8px;
      white-space: pre-wrap; word-break: break-all;
      max-height: 55vh; overflow-y: auto;
    }
  </style>
  <script>
    // Runs synchronously on HTML parse — captures the very first state.
    var $diag = null;
    function diagLog(s) {
      if (!$diag) $diag = document.getElementById('diag');
      if ($diag) $diag.textContent += s + '\n';
      console.log('[DIAG]', s);
    }
    window.diagLog = diagLog;
    document.addEventListener('DOMContentLoaded', function() {
      $diag = document.getElementById('diag');
      diagLog('=== PAGE LOAD ===');
      diagLog('crossOriginIsolated: ' + (typeof crossOriginIsolated !== 'undefined' ? crossOriginIsolated : 'N/A'));
      diagLog('SharedArrayBuffer: ' + (typeof SharedArrayBuffer !== 'undefined'));
      diagLog('Atomics: ' + (typeof Atomics !== 'undefined'));
      diagLog('SW supported: ' + ('serviceWorker' in navigator));
      diagLog('SW controller: ' + (
        navigator.serviceWorker && navigator.serviceWorker.controller
          ? navigator.serviceWorker.controller.scriptURL
          : 'none'
      ));
      diagLog('UA: ' + navigator.userAgent.slice(0, 120));
    });
  </script>
  <!-- ===== END DIAGNOSTIC ===== -->

  <!--
    When the service worker takes control for the first time (or updates),
    reload so the navigation itself goes through the SW and receives the
    COOP/COEP headers it injects (needed for SharedArrayBuffer / WASM).
  -->
  <script>
    if ('serviceWorker' in navigator && !crossOriginIsolated) {
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        diagLog('SW controllerchange → reloading');
        location.reload();
      }, { once: true });
    }
  </script>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="diag"></div>
  <div id="app">
    <!-- Loading screen -->
    <div id="loading-screen">
      <div class="loading-logo">TwixT</div>
      <div class="loading-spinner"></div>
      <div id="loading-msg">Loading AI model…</div>
    </div>

    <!-- Game screen (hidden until ready) -->
    <div id="game-screen" class="hidden">
      <header id="status-bar">
        <span id="status-text">Your turn (Black)</span>
        <button id="undo-btn" title="Undo your last move">Undo</button>
        <button id="new-game-btn" title="Start a new game">New</button>
      </header>

      <main id="board-container">
        <canvas id="board-canvas"></canvas>
      </main>

      <!-- Overlay shown while AI is thinking -->
      <div id="thinking-overlay" class="hidden">
        <div class="thinking-spinner"></div>
        <div>AI is thinking…</div>
      </div>

      <!-- Game-over overlay -->
      <div id="gameover-overlay" class="hidden">
        <div id="gameover-msg"></div>
        <button id="gameover-new-btn">Play Again</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
