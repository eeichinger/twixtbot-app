<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#16213e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TwixT" />
  <link rel="apple-touch-icon" href="/icons/192.png" />
  <title>TwixT vs AI</title>

<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- Intro screen (shown by default; also shown after game ends) -->
    <div id="intro-screen" style="position:relative">
      <div class="loading-logo">TwixT</div>
      <div id="intro-subtitle">vs Computer</div>
      <div id="mode-selector">
        <button class="mode-btn active" data-mode="pvc">vs Computer</button>
        <button class="mode-btn"        data-mode="pvp">vs Player</button>
      </div>
      <button id="start-btn">Start Game</button>
      <p class="intro-attribution">Based on <a href="https://github.com/BonyJordan/twixtbot" target="_blank" rel="noopener">twixtbot</a> by Jordan Lampe &mdash; MIT License</p>
      <span id="intro-version" title="Tap 3× for diagnostics" style="position:absolute;bottom:12px;right:12px;font-size:0.7rem;color:#94a3b8;cursor:pointer;user-select:none;-webkit-user-select:none;padding:4px"></span>
    </div>

    <!-- Loading screen (hidden; shown only if model not yet ready when Start is pressed) -->
    <div id="loading-screen" class="hidden">
      <div class="loading-logo">TwixT</div>
      <div class="loading-spinner"></div>
      <div id="loading-msg">Loading AI model…</div>
    </div>

    <!-- Game screen (hidden until game starts) -->
    <div id="game-screen" class="hidden">
      <header id="status-bar">
        <span id="status-text">Your turn (Blue)</span>
        <select id="think-time-select" title="AI think time" class="hidden"></select>
        <button id="hint-btn"     title="Let the AI play this move for you" class="hidden">AI move</button>
        <button id="undo-btn"     title="Undo your last move">Undo</button>
        <button id="swap-btn" class="hidden" title="Swap sides: take the AI's first peg and play as White">Swap</button>
        <button id="new-game-btn" title="Return to title screen">New</button>
        <span id="app-version" title="Tap 3× for diagnostics" style="font-size:0.7rem;color:#94a3b8;cursor:pointer;user-select:none;-webkit-user-select:none;padding:4px"></span>
      </header>

      <main id="board-container">
        <canvas id="board-canvas"></canvas>
      </main>

      <footer id="game-footer">
        <a href="https://github.com/eeichinger/twixtbot-app/issues/new" target="_blank" rel="noopener">please report problems here</a>
      </footer>

      <!-- Overlay shown while AI is thinking -->
      <div id="thinking-overlay" class="hidden">
        <div class="thinking-spinner"></div>
        <div>AI is thinking…</div>
      </div>
    </div>

    <!-- Diagnostic log overlay — lives outside game-screen so it's reachable from any screen -->
    <div id="diag-panel" style="display:none;position:fixed;bottom:0;left:0;right:0;max-height:40vh;overflow-y:auto;background:rgba(0,0,0,0.85);color:#00ff88;font-size:11px;font-family:monospace;padding:8px;z-index:9999;touch-action:pan-y">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <strong>Diagnostics</strong>
        <div style="display:flex;gap:6px">
          <button id="diag-share-btn" style="background:none;border:1px solid #00ff88;color:#00ff88;padding:1px 6px;cursor:pointer;font-size:11px">Share</button>
          <button id="diag-clear-btn" style="background:none;border:1px solid #00ff88;color:#00ff88;padding:1px 6px;cursor:pointer;font-size:11px">Clear</button>
        </div>
      </div>
      <div id="diag-log-prev" style="color:#aaa;border-bottom:1px solid #444;margin-bottom:4px;padding-bottom:4px"></div>
      <div id="diag-log-cur"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
