name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # -----------------------------------------------------------------------
  # Python back-end tests
  # -----------------------------------------------------------------------
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v

  # -----------------------------------------------------------------------
  # Export trained model: TF1 checkpoint → PyTorch .pt → ONNX
  # -----------------------------------------------------------------------
  export-model:
    name: Export model (TF1 → ONNX)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-export.txt

      - name: Install Python dependencies
        run: pip install -r requirements-export.txt

      - name: Convert TF1 checkpoint → PyTorch .pt
        run: |
          python tools/convert_tf1_to_pt.py \
            --checkpoint models/six-917000 \
            --out models/six-917000.pt

      - name: Export PyTorch .pt → ONNX
        run: |
          python tools/export_onnx.py \
            --model models/six-917000.pt \
            --out webapp/public/model.onnx

      - name: Upload ONNX artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-onnx
          path: webapp/public/model.onnx
          retention-days: 90
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Webapp type-check + unit tests (independent of model export)
  # Runs on every push so TypeScript errors and test failures are always caught.
  # -----------------------------------------------------------------------
  webapp-check:
    name: Webapp (type-check + test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: webapp

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

  # -----------------------------------------------------------------------
  # Webapp build + deploy (requires model artifact + clean check job)
  # -----------------------------------------------------------------------
  webapp-build:
    name: Webapp (build + deploy)
    runs-on: ubuntu-latest
    needs: [export-model, webapp-check]

    # Allow the job to write to GitHub Pages
    permissions:
      contents: write

    defaults:
      run:
        working-directory: webapp

    steps:
      - uses: actions/checkout@v4

      - name: Download ONNX model
        uses: actions/download-artifact@v4
        with:
          name: model-onnx
          path: webapp/public/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build PWA
        run: npm run build

      # Add a Cloudflare/Netlify-style _headers file so GitHub Pages serves
      # the COOP/COEP headers required for WASM threading (SharedArrayBuffer).
      # GitHub Pages itself ignores _headers, but hosting platforms that do
      # support it (Cloudflare Pages, Netlify) will pick it up automatically.
      - name: Write _headers for COOP/COEP
        run: |
          cat > dist/_headers << 'EOF'
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp
          EOF

      - name: Upload PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: twixtbot-pwa
          path: webapp/dist/
          retention-days: 30
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        # Only deploy on pushes to main (not on PRs or other branches)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: webapp/dist
          force_orphan: true
