name: Probe Cloudflare Worker

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-cloudflare.yml"

jobs:
  probe:
    name: Probe Cloudflare Worker (TLS + HTTP)
    runs-on: ubuntu-latest

    steps:
      - name: TLS — openssl with TLS 1.3
        run: |
          echo "=== openssl TLS 1.3 ==="
          echo | openssl s_client \
            -connect littlegolem-proxy.eeichinger.workers.dev:443 \
            -servername littlegolem-proxy.eeichinger.workers.dev \
            -tls1_3 -showcerts 2>&1 | head -40 || true

      - name: TLS — openssl with TLS 1.2
        run: |
          echo "=== openssl TLS 1.2 ==="
          echo | openssl s_client \
            -connect littlegolem-proxy.eeichinger.workers.dev:443 \
            -servername littlegolem-proxy.eeichinger.workers.dev \
            -tls1_2 -showcerts 2>&1 | head -40 || true

      - name: TLS — openssl without SNI (raw IP)
        run: |
          echo "=== openssl no SNI (raw IP) ==="
          echo | openssl s_client \
            -connect 172.67.160.217:443 \
            2>&1 | head -20 || true

      - name: curl verbose — worker root (TLS 1.2)
        run: |
          echo "=== curl TLS 1.2: worker root ==="
          curl -v -k --tlsv1.2 --tls-max 1.2 --max-time 15 \
            "https://littlegolem-proxy.eeichinger.workers.dev/" \
            2>&1 || true

      - name: curl verbose — worker root (TLS 1.3)
        run: |
          echo "=== curl TLS 1.3: worker root ==="
          curl -v -k --tlsv1.3 --max-time 15 \
            "https://littlegolem-proxy.eeichinger.workers.dev/" \
            2>&1 || true

      - name: curl verbose — proxy SGF file
        run: |
          echo "=== curl: proxy LG SGF ==="
          curl -v -k --max-time 15 \
            "https://littlegolem-proxy.eeichinger.workers.dev/?url=https%3A%2F%2Fwww.littlegolem.net%2Fservlet%2Fsgf%2F2546140%2Fgame2546140.tsgf" \
            2>&1 || true

      - name: curl verbose — direct LG SGF (baseline)
        run: |
          echo "=== curl: direct LG SGF ==="
          curl -v -k --max-time 15 \
            "https://www.littlegolem.net/servlet/sgf/2546140/game2546140.tsgf" \
            2>&1 || true

      - name: curl — direct login to LG
        run: |
          echo "=== curl: direct LG login ==="
          curl -v --max-time 15 -L \
            -X POST "https://www.littlegolem.net/jsp/login/index.jsp" \
            -d "login=oakinger&password=vupysoka" \
            2>&1 || true

      - name: curl — login via Cloudflare worker
        run: |
          echo "=== curl: login via worker ==="
          curl -v --max-time 15 -L \
            -X POST "https://littlegolem-proxy.eeichinger.workers.dev/?url=https%3A%2F%2Fwww.littlegolem.net%2Fjsp%2Flogin%2Findex.jsp" \
            -d "login=oakinger&password=vupysoka" \
            2>&1 || true
